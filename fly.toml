app = "heidy-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "heidy-backend.fly.dev"
  PORT = "4000"
  POOL_SIZE = "8"

[deploy]
  release_command = "/app/bin/migrate"
  release_command_timeout = "10m"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
